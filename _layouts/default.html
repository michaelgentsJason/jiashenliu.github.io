<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Jiashen Liu's academic homepage. Embodied intelligence, 3D perception, and real-to-sim-to-real systems.">
    <title>{{ page.title }} - Jiashen Liu</title>
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/images/portrait.jpg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/fontawesome.min.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5" aria-label="Main navigation">
        <div class="container-lg">
            <a class="navbar-brand" href="{{ '/' | relative_url }}">Jiashen Liu</a>
            <div class="navbar-tools d-flex align-items-center order-1 order-sm-2">
                <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z"/></svg>
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                </button>
                <button class="navbar-toggler" type="button" style="font-size: 1em; padding: 0.5em;" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><i class="fas fa-map" aria-hidden="true"></i> Menu</button>
            </div>
            <div class="collapse navbar-collapse order-2 order-sm-1" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item{% if page.nav == 'home' %} active{% endif %}"><a class="nav-link" href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a></li>
                    <li class="nav-item{% if page.nav == 'publications' %} active{% endif %}"><a class="nav-link" href="{{ '/publications' | relative_url }}"{% if page.nav == 'publications' %} aria-current="page"{% endif %}>Publications</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container-lg">{{ content }}</main>
    <footer class="footer"><div class="container-lg"><div class="row my-3">
        <div class="col-6"><div class="text-muted">Last updated: Nov 2026</div></div>
        <div class="col-6"><div class="text-right text-muted">Design and source code from <a href="https://github.com/luost26/academic-homepage"><i class="fas fa-pencil-ruler" aria-hidden="true"></i> academic-homepage</a></div></div>
    </div></div></footer>
    <script>
        const menuButton = document.querySelector('.navbar-toggler');
        menuButton.addEventListener('click', () => {
            const expanded = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!expanded));
            document.getElementById('navbarResponsive').classList.toggle('show', !expanded);
        });
    </script>
</body>
</html>
